<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>صفحه یافت نشد (۴۰۴) | حشمت صیادپرست</title>
  <meta name="description" content="این صفحه در وب‌سایت حشمت صیادپرست یافت نشد. به صفحهٔ اصلی پروفایل بازگردید.">
  <link rel="icon" href="assets/avatar.jpg" type="image/jpeg">
  <link rel="canonical" href="https://heshmatsayad.github.io/">
  <link rel="stylesheet" href="styles.css">
  <style>
    .nf-wrap { min-height: 70vh; display: grid; place-items: center; padding: 40px 20px; }
    .nf-card { max-width: 520px; text-align: center; }
    .nf-code { font-size: 72px; font-weight: 900; color: var(--green-dark); line-height: 1; }
    .nf-card h1 { font-size: 24px; margin: 12px 0; }
    .nf-card p { color: var(--muted); margin-bottom: 20px; }
    .nf-home { display: inline-block; background: var(--green); color: #fff; text-decoration: none;
      font-weight: 700; padding: 12px 28px; border-radius: 10px; transition: background .2s; }
    .nf-home:hover { background: var(--green-dark); }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <section class="card nf-card">
      <div class="nf-code">۴۰۴</div>
      <h1>صفحه یافت نشد</h1>
      <p>این صفحه در وب‌سایت حشمت صیادپرست وجود ندارد یا جابه‌جا شده است. برای دیدن پروفایل کامل به صفحهٔ اصلی بازگردید.</p>
      <a class="nf-home" href="/">بازگشت به صفحهٔ اصلی</a>
    </section>
  </main>
</body>
</html>
